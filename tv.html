<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Beam is an open-source USB and DLNA media player for Samsung Tizen TVs with subtitles, resume playback, and remote-friendly navigation.">
<meta name="keywords" content="Samsung TV media player, Tizen media player, DLNA, UPnP, USB media player, Samsung Smart TV, open source">
<meta property="og:title" content="Beam — Open-source media player for Samsung Tizen TVs">
<meta property="og:description" content="Play local USB and network media on Samsung TVs with subtitles, resume playback, and remote-friendly navigation.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://atharvachauhan.site/beam-tv/">
<meta name="twitter:card" content="summary">
<title>Beam</title>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/player.css">
</head>
<body>
  <div id="stage">
    <div id="splash">
      <div class="splash-beam"></div>
      <div class="splash-logo"></div>
      <div class="splash-word">BEAM</div>
    </div>

    <nav id="sidebar" class="collapsed">
      <div class="brand"></div>
      <div class="nav-spacer"></div>
    </nav>

    <!-- Every screen is just an empty .content shell now. The static page
         title/subtitle that used to sit above the USB and Home content are
         gone: the hero panel each screen renders carries the identity of
         what's on screen far better than a fixed "USB" heading did, and the
         ~110px the heading block occupied is exactly what the grid needed to
         fit a second row of cards instead of leaving the space blank. -->
    <main id="main">
      <section id="screen-home" class="screen active">
        <div class="content"></div>
      </section>

      <section id="screen-usb" class="screen">
        <div class="content"></div>
      </section>

      <section id="screen-network" class="screen">
        <div class="content"></div>
      </section>

      <section id="screen-settings" class="screen">
        <div class="content"></div>
      </section>
    </main>

    <!-- Deliberately siblings of #main, not children of it: #main is offset
         by the sidebar's width (left: var(--sidebar-w)), and .screen's base
         inset:0 positions relative to its nearest positioned ancestor. Being
         inside #main meant these could never actually cover the true full
         1920x1080 stage — a persistent gap on the left matching the
         sidebar's width remained even when the sidebar itself was hidden,
         since nothing ever changed #main's own box. -->
    <section id="screen-player" class="screen">
      <video id="player-video" playsinline></video>
      <div id="player-audio-art" class="hidden">
        <div id="player-audio-glyph">
          <svg viewBox="0 0 24 24" width="64" height="64" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        </div>
      </div>
      <div id="player-controls">
        <div id="player-top">
          <div id="player-title"></div>
        </div>
        <div id="player-bottom">
          <div id="player-playicon" class="is-playing">
            <svg class="i-play" viewBox="0 0 24 24" width="30" height="30" fill="currentColor"><polygon points="6 3 20 12 6 21 6 3"/></svg>
            <svg class="i-pause" viewBox="0 0 24 24" width="30" height="30" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
          </div>
          <div id="player-progress"><div id="player-progress-fill"></div></div>
          <div id="player-time">0:00 / 0:00</div>
        </div>
        <div id="player-hint">◀ ▶ seek 10s &nbsp;·&nbsp; OK play/pause &nbsp;·&nbsp; double-press for picture-in-picture &nbsp;·&nbsp; Blue toggle subtitles &nbsp;·&nbsp; Back exit</div>
      </div>
      <div id="pip-badge">▶ Double-press play/pause to expand</div>
    </section>

    <section id="screen-photo" class="screen">
      <div id="photo-stage">
        <img id="photo-img" alt="">
      </div>
      <div id="photo-controls">
        <div id="photo-title"></div>
        <div id="photo-counter"></div>
      </div>
      <div id="photo-hint">◀ ▶ next / previous &nbsp;·&nbsp; Back exit</div>
    </section>

    <div id="toast"></div>
  </div>

  <script src="js/env.js"></script>
  <script src="js/scale.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/metadata.js"></script>
  <script src="js/usbSource.js"></script>
  <script src="js/library.js"></script>
  <script src="js/dlnaSource.js"></script>
  <script src="js/thumbs.js"></script>
  <script src="js/player.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
