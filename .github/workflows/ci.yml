name: CI

on:
    push:
        branches:
            - main
        paths:
            - 'beam-server/**'
            - '.github/workflows/ci.yml'

    pull_request:
        branches:
            - main
        paths:
            - 'beam-server/**'
            - '.github/workflows/ci.yml'

permissions:
    contents: read

jobs:
    tests:
        name: Run NPM Tests
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: beam-server

        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                node-version: 22
                cache: npm
                cache-dependency-path: beam-server/package-lock.json
            - run: npm ci
            - run: npm test
